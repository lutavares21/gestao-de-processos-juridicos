{% extends "base.html" %}

{% block titulo %}Login - Gestão de Processos{% endblock %}

{% block corpo %}
  <div class="pagina-inicio">

    <div class="inicio-topo">
      <img src="{{ url_for('static', filename='images/logo.png') }}"
           alt="TavisJur - Gestão Jurídica Inteligente"
           class="logo-login">
    </div>

    <div class="caixa-login">
      <div class="bloco-inicio">
        <h2>Entrar</h2>

        {% if erro_login %}
        <div class="flash flash-erro">Login ou senha incorretos.</div>
        {% endif %}

        {% if get_flashed_messages() %}
        <div class="flash flash-erro">{{ get_flashed_messages()[0] }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
          <div class="campo">
            <label for="login">Login</label>
            <input type="text" id="login" name="login" required autofocus>
          </div>
          <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required>
          </div>
          <button type="submit" class="btn btn-salvar">Entrar</button>
        </form>
      </div>
    </div>

  </div>
{% endblock %}
